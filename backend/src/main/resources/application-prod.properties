
server.port= ${PORT}

jwt.secret=${JWT_SECRET}

# backend-frontend interaction
app.cors.allowed-origins = ${PROD_CORS_ALLOWED_ORIGINS}

###### Connect app to database :- ######

spring.datasource.url= ${SPRING_DATASOURCE_URL}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


###### JPA and Hibernate config (while handling database) :- ######

spring.jpa.hibernate.ddl-auto= create-drop
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true
logging.level.org.hibernate.orm.jdbc.bind = trace


####### Java mail service (using Gmail SMTP) :- ######

# ___SMTP Host (e.g. Gmail)
spring.mail.host = ${SPRING_MAIL_HOST}
spring.mail.port = ${SPRING_MAIL_PORT}

# ___email credentials
spring.mail.username = ${SPRING_MAIL_USERNAME}
spring.mail.password = ${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


###### API keys :- ######
razorpay.api.key = ${RAZORPAY_API_KEY}
razorpay.api.secret = ${RAZORPAY_SECRET_KEY}